name: Drevene terasy / Build, tests and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install pinned prototype dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and production build
        run: npm run build
      - name: Verify deterministic geometry and stock calculations
        run: npm run test:engine
      - name: Verify commerce logic and backend security
        run: npm run test:commerce && npm run test:server
      - name: Install browser for homepage verification
        run: npx playwright install --with-deps chromium
      - name: Verify responsive homepage and interactions
        run: npm run test:homepage
      - name: Verify catalog, planner, cart and responsive platform
        run: npm run test:platform
      - name: Save viewport screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homepage-2027-qa
          path: |
            qa/ci
            qa/ci-platform
          retention-days: 14
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
